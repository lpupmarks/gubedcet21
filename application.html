<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Casual Leave Application Generator — Signature on Top</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f5f5f5;
    padding: 20px;
  }
  .container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    max-width: 700px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  label {
    display: block;
    margin-top: 10px;
    font-weight: 600;
  }
  input, select, textarea, button {
    margin-top: 5px;
    padding: 8px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }
  textarea {
    resize: vertical;
  }
  #application {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 20px;
    margin-top: 20px;
    background: #fffefc;
    min-height: 200px;
    font-size: 14px;
  }
  button {
    background-color: #0078d7;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background-color: #005fa3;
  }
  h2 {
    text-align: center;
  }

  .sig-img {
    width: 220px;
    height: 100px;
    object-fit: contain;
    display: block;
    margin-bottom: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Casual Leave Application Generator</h2>

  <label for="absenceType">Absence Type:</label>
  <select id="absenceType">
    <option value="will">I will be absent</option>
    <option value="was">I was absent</option>
  </select>

  <label>From Date:</label>
  <input type="date" id="fromDate">

  <label>To Date:</label>
  <input type="date" id="toDate">

  <label for="reason">Reason:</label>
  <select id="reasonSelect" onchange="toggleOtherReason()">
    <option value="illness">illness</option>
    <option value="an unavoidable circumstance">an unavoidable circumstance</option>
    <option value="a family function">a family function</option>
    <option value="a family emergency">a family emergency</option>
    <option value="other">Other</option>
  </select>

  <textarea id="otherReason" placeholder="Please specify your reason..." style="display:none;"></textarea>

  <label for="name">Your Name:</label>
  <input type="text" id="name" placeholder="Enter your full name">

  <button onclick="generateApplication()">Generate Application</button>

  <div id="application" contenteditable="true" style="display:none;"></div>

  <button id="downloadBtn" style="display:none;" onclick="downloadPDF()">Download as PDF</button>
</div>

<script>
// --- Helper Functions ---
function formatDate(dateStr) {
  if (!dateStr) return "";
  const date = new Date(dateStr);
  const day = date.getDate();
  const month = date.toLocaleString("en-US", { month: "long" });
  const year = date.getFullYear();
  return `${day} ${month}, ${year}`;
}

function getDaysDifference(fromDate, toDate) {
  if (!toDate || fromDate === toDate) return 1;
  const start = new Date(fromDate);
  const end = new Date(toDate);
  return Math.ceil((end - start) / (1000*60*60*24)) + 1;
}

function toggleOtherReason() {
  const reasonSelect = document.getElementById("reasonSelect");
  const otherReason = document.getElementById("otherReason");
  otherReason.style.display = reasonSelect.value === "other" ? "block" : "none";
}

function pxToMm(px) { return px * 0.264583; }

async function loadImageAsDataURL(imgElement) {
  return new Promise((resolve, reject) => {
    const src = imgElement.src;
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = function() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        resolve({ dataURL: canvas.toDataURL("image/png") });
      } catch (err) { reject(err); }
    };
    img.onerror = function() { reject(new Error("Failed to load image")); };
    img.src = src;
  });
}

function printTextBlock(doc, text, x, y, maxWidth, lineHeight) {
  const lines = doc.splitTextToSize(text, maxWidth);
  lines.forEach(line => {
    if (y + lineHeight > doc.internal.pageSize.height - 20) { doc.addPage(); y = 20; }
    doc.text(line, x, y);
    y += lineHeight;
  });
  return y;
}

// --- Generate HTML Application ---
function generateApplication() {
  const type = document.getElementById("absenceType").value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;
  const reasonSelect = document.getElementById("reasonSelect").value;
  const otherReason = document.getElementById("otherReason").value.trim();
  const name = document.getElementById("name").value || "Name Here";

  if (!fromDate) { alert("Please select at least one date."); return; }

  const reason = reasonSelect === "other" && otherReason ? otherReason : reasonSelect;
  const formattedFromDate = formatDate(fromDate);
  let dateText = formattedFromDate;
  const daysCount = getDaysDifference(fromDate, toDate);
  if (toDate && toDate !== fromDate) dateText = `${formattedFromDate} - ${formatDate(toDate)}`;
  const dayText = daysCount === 1 ? "day" : "days";

  const bodyText = type === "will" 
    ? `With due respect, I would like to inform you that I will not be able to attend my duty on ${dateText} due to ${reason}. I would be grateful if you kindly grant me a casual leave for the above-mentioned ${dayText}.`
    : `With due respect, I would like to inform you that I could not attend my duty on ${dateText} due to ${reason}. I kindly request you to consider my absence as casual leave for the above-mentioned ${dayText}.`;

  const today = formatDate(new Date().toISOString().split("T")[0]);

  const applicationHTML = `
    <p>To,<br>The Principal,<br>Kuralguri Higher Secondary School.</p>
    <p style="text-align:right;">Date: ${today}</p>
    <p><strong>Sub:</strong> Application for casual leave.</p>
    <p>Respected Sir,<br>${bodyText}</p>
    <p>Yours faithfully,<br><br>
<img class="sig-img" id="sigImage" src="https://cors-anywhere.herokuapp.com/https://blogger.googleusercontent.com/img/a/AVvXsEjQvHTDiJHoQFL5UB7aV5KHT_GppbWjVGTH6N1eT1SwC_4zElhCH1Jb2sSiFGu284CQWBC0uV_2UAC-EnUw_VYtplMrXsWUvcd0RssGScrJ0icVgklpinlTIF0UCstgXRXZVwbWurszLBQsVgkVjX3OQH6TTzk9ctmtavZmrkXzNdWCrjopHp5t4OkNPC0" style="width:220px; height:100px;" />
<br>
      <strong>${name}</strong><br>
      Assistant Teacher<br>
      Kuralguri Higher Secondary School
    </p>
  `;

  const appDiv = document.getElementById("application");
  appDiv.innerHTML = applicationHTML;
  appDiv.style.display = "block";
  document.getElementById("downloadBtn").style.display = "block";
  appDiv.scrollIntoView({ behavior: "smooth" });
}

// --- Download PDF ---
async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });

  const appDiv = document.getElementById("application");
  const paragraphs = Array.from(appDiv.querySelectorAll("p"));
  const margin = 20, lineHeight = 7;
  const pageWidth = doc.internal.pageSize.width;
  const maxWidth = pageWidth - 2*margin;
  let y = margin;

  for (let p of paragraphs) {
    const sigImage = p.querySelector("img");

    if (sigImage) {
      // 1️⃣ Print text before the image
      const textBeforeImg = "Yours faithfully,"; // text above the signature
      y = printTextBlock(doc, textBeforeImg, margin, y, maxWidth, lineHeight);

      // 2️⃣ Draw the signature image
      try {
        const { dataURL } = await loadImageAsDataURL(sigImage);
        const imgWidthMm = pxToMm(220);
        const imgHeightMm = pxToMm(100);
        doc.addImage(dataURL, "PNG", margin, y, imgWidthMm, imgHeightMm);
        y += imgHeightMm + 3; // add small gap below image
      } catch (err) {
        console.warn("Could not embed signature image:", err);
        doc.text("(Signature image could not be embedded)", margin, y);
        y += lineHeight;
      }

      // 3️⃣ Print name and remaining lines
      const nameElement = p.querySelector("strong");
      if (nameElement) {
        doc.setFont("Times", "bold");
        doc.text(nameElement.innerText, margin, y);
        doc.setFont("Times", "normal");
        y += lineHeight;

        const remainingLines = [
          "Assistant Teacher",
          "Kuralguri Higher Secondary School"
        ];
        remainingLines.forEach(line => { 
          doc.text(line, margin, y); 
          y += lineHeight; 
        });
      }
    } else {
      // Normal paragraph
      y = printTextBlock(doc, p.innerText, margin, y, maxWidth, lineHeight);
      y += lineHeight;
    }
  }

  doc.save("casual_leave_application.pdf");
}

// --- Helper functions ---
function pxToMm(px) { return px * 0.264583; }

function printTextBlock(doc, text, x, y, maxWidth, lineHeight) {
  const lines = doc.splitTextToSize(text, maxWidth);
  lines.forEach(line => {
    if (y + lineHeight > doc.internal.pageSize.height - 20) { doc.addPage(); y = 20; }
    doc.text(line, x, y);
    y += lineHeight;
  });
  return y;
}

async function loadImageAsDataURL(imgElement) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = function() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        resolve({ dataURL: canvas.toDataURL("image/png") });
      } catch (err) { reject(err); }
    };
    img.onerror = function() { reject(new Error("Failed to load image")); };
    img.src = imgElement.src;
  });
}

</script>
</body>
</html>
