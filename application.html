<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Casual Leave Application Generator — Fixed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f5f5f5;
    padding: 20px;
  }
  .container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    max-width: 700px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  label {
    display: block;
    margin-top: 10px;
    font-weight: 600;
  }
  input, select, textarea, button {
    margin-top: 5px;
    padding: 8px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }
  textarea {
    resize: vertical;
  }
  #application {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 20px;
    margin-top: 20px;
    background: #fffefc;
    min-height: 200px;
    font-size: 14px;
  }
  button {
    background-color: #0078d7;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background-color: #005fa3;
  }
  h2 {
    text-align: center;
  }

  /* Force the preview image to exactly 220x100 px */
  .sig-img {
    width: 220px;
    height: 100px;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Casual Leave Application Generator</h2>

  <label for="absenceType">Absence Type:</label>
  <select id="absenceType">
    <option value="will">I will be absent</option>
    <option value="was">I was absent</option>
  </select>

  <label>From Date:</label>
  <input type="date" id="fromDate">

  <label>To Date:</label>
  <input type="date" id="toDate">

  <label for="reason">Reason:</label>
  <select id="reasonSelect" onchange="toggleOtherReason()">
    <option value="illness">illness</option>
    <option value="an unavoidable circumstance">an unavoidable circumstance</option>
    <option value="a family function">a family function</option>
    <option value="a family emergency">a family emergency</option>
    <option value="other">Other</option>
  </select>

  <textarea id="otherReason" placeholder="Please specify your reason..." style="display:none;"></textarea>

  <label for="name">Your Name:</label>
  <input type="text" id="name" placeholder="Enter your full name">

  <button onclick="generateApplication()">Generate Application</button>

  <div id="application" contenteditable="true" style="display:none;"></div>

  <button id="downloadBtn" style="display:none;" onclick="downloadPDF()">Download as PDF</button>
</div>

<script>
// Helper function to format date as "DD Month, YYYY"
function formatDate(dateStr) {
  if (!dateStr) return "";
  const date = new Date(dateStr);
  const day = date.getDate();
  const month = date.toLocaleString("en-US", { month: "long" });
  const year = date.getFullYear();
  return `${day} ${month}, ${year}`;
}

// Helper function to calculate number of days between two dates
function getDaysDifference(fromDate, toDate) {
  if (!toDate || fromDate === toDate) return 1;
  const start = new Date(fromDate);
  const end = new Date(toDate);
  const diffTime = end - start;
  return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
}

// Show or hide the "Other Reason" textarea
function toggleOtherReason() {
  const reasonSelect = document.getElementById("reasonSelect");
  const otherReason = document.getElementById("otherReason");
  if (reasonSelect.value === "other") {
    otherReason.style.display = "block";
  } else {
    otherReason.style.display = "none";
  }
}

function generateApplication() {
  const type = document.getElementById("absenceType").value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;
  const reasonSelect = document.getElementById("reasonSelect").value;
  const otherReason = document.getElementById("otherReason").value.trim();
  const name = document.getElementById("name").value || "Name Here";

  if (!fromDate) {
    alert("Please select at least one date.");
    return;
  }

  // Determine final reason text
  const reason = reasonSelect === "other" && otherReason
    ? otherReason
    : reasonSelect;

  // Format dates
  const formattedFromDate = formatDate(fromDate);
  let dateText = formattedFromDate;
  const daysCount = getDaysDifference(fromDate, toDate);
  if (toDate && toDate !== fromDate) {
    const formattedToDate = formatDate(toDate);
    dateText = `${formattedFromDate} - ${formattedToDate}`;
  }

  const dayText = daysCount === 1 ? "day" : "days";

  let bodyText = "";
  if (type === "will") {
    bodyText = `With due respect, I would like to inform you that I will not be able to attend my duty on ${dateText} due to ${reason}. I would be grateful if you kindly grant me a casual leave for the above-mentioned ${dayText}.`;
  } else {
    bodyText = `With due respect, I would like to inform you that I could not attend my duty on ${dateText} due to ${reason}. I kindly request you to consider my absence as casual leave for the above-mentioned ${dayText}.`;
  }

  const today = formatDate(new Date().toISOString().split("T")[0]);

  // Build HTML with properly styled image element (class .sig-img ensures 220x100 px)
  const applicationHTML = `
    <p>To,<br>
    The Principal,<br>
    Kuralguri Higher Secondary School.</p>

    <p style="text-align:right;">Date: ${today}</p>

    <p><strong>Sub:</strong> Application for casual leave.</p>

    <p>Respected Sir,<br>${bodyText}</p>

    <p>Yours faithfully,<br><br>
    <strong>${name}</strong><br>
    <img class="sig-img" id="sigImage" src="sign.jpg" alt="signature image" />
    Assistant Teacher<br>
    Kuralguri Higher Secondary School</p>
  `;

  const appDiv = document.getElementById("application");
  appDiv.innerHTML = applicationHTML;
  appDiv.style.display = "block";
  document.getElementById("downloadBtn").style.display = "block";
  appDiv.scrollIntoView({ behavior: "smooth" });
}

// Convert pixels to millimeters (assuming 96 DPI): 1 px = 0.264583 mm
function pxToMm(px) {
  return px * 0.264583;
}

async function loadImageAsDataURL(imgElement) {
  // Try using the image element directly if CORS permits.
  return new Promise((resolve, reject) => {
    const src = imgElement.src;
    const img = new Image();
    img.crossOrigin = "Anonymous"; // attempt to avoid tainting canvas
    img.onload = function() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const dataURL = canvas.toDataURL("image/png");
        resolve({ dataURL, widthPx: img.naturalWidth, heightPx: img.naturalHeight });
      } catch (err) {
        reject(err);
      }
    };
    img.onerror = function(e) {
      reject(new Error("Failed to load image for embedding: " + src));
    };
    img.src = src;
  });
}

async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "a4"
  });

  const appDiv = document.getElementById("application");
  if (!appDiv || appDiv.style.display === "none") {
    alert("Please generate the application first.");
    return;
  }

  // We'll reconstruct the PDF content in a controlled layout so we can position image precisely.
  // Extract text parts from the DOM instead of raw innerText to preserve structure.
  const paragraphs = Array.from(appDiv.querySelectorAll("p"));
  const margin = 20;
  let y = 20;
  const lineHeight = 7;
  const pageWidth = doc.internal.pageSize.width; // 210 mm for A4
  const maxWidth = pageWidth - 2 * margin;

  doc.setFont("Times", "normal");
  doc.setFontSize(14);

  // Helper to print paragraphs with wrapping and page break handling
  function printTextBlock(text, startX, startY) {
    const lines = doc.splitTextToSize(text, maxWidth - (startX - margin));
    let localY = startY;
    lines.forEach(line => {
      if (localY + lineHeight > doc.internal.pageSize.height - margin) {
        doc.addPage();
        localY = margin;
      }
      doc.text(line, startX, localY);
      localY += lineHeight;
    });
    return localY;
  }

  // Print first paragraph(s) (To, The Principal...)
  if (paragraphs.length > 0) {
    // We assume the first <p> is recipient block (multiple lines)
    const recipientHTML = paragraphs[0].innerText.trim();
    y = printTextBlock(recipientHTML, margin, y) + lineHeight;
  }

  // Find and print date line (paragraph with "Date:")
  let signatureImageElement = null;
  for (let i = 1; i < paragraphs.length; i++) {
    const p = paragraphs[i];
    const text = p.innerText.trim();
    if (text.startsWith("Date:")) {
      // Right-align date on same 'line' position
      const dateText = text; // e.g. "Date: 26 October, 2025"
      const dateWidth = doc.getTextWidth(dateText);
      // Align to right margin
      const dateX = pageWidth - margin - dateWidth;
      // print on current y (slightly lower)
      if (y + lineHeight > doc.internal.pageSize.height - margin) {
        doc.addPage();
        y = margin;
      }
      doc.text(dateText, dateX, y);
      y += lineHeight + 2;
    } else {
      // look for image inside this paragraph so we don't duplicate it later
      const img = p.querySelector("img");
      if (img) signatureImageElement = img;
      // Print other paragraphs normally
      y = printTextBlock(text, margin, y) + lineHeight;
    }
  }

  // By this point we've printed the body. Now add the signature image near the signature.
  // We'll try to place image just above the "Assistant Teacher" text (search for that)
  // Find the paragraph which contains "Assistant Teacher"
  const assistantPara = paragraphs.find(p => p.innerText.includes("Assistant Teacher"));
  // compute y position to place image: if assistantPara exists, we'll compute expected y by re-wrapping text
  // For simplicity, add image near the bottom of the document just before saving (but above bottom margin).
  const bottomMargin = margin;
  let imageEmbedded = false;
  if (signatureImageElement) {
    try {
      const { dataURL, widthPx, heightPx } = await loadImageAsDataURL(signatureImageElement);

      // Determine desired display size in mm: we want to follow the preview CSS 220x100 px
      // If the image element has style width/height, prefer that, else fallback to natural size
      const style = signatureImageElement.getAttribute("style") || "";
      // We'll read width and height from rendered size if possible
      const renderedWidth = signatureImageElement.width || 220; // px
      const renderedHeight = signatureImageElement.height || 100; // px

      // Convert px to mm
      const imgWidthMm = pxToMm(renderedWidth);
      const imgHeightMm = pxToMm(renderedHeight);

      // Place image above bottom margin, or just below current y if space exists
      let imgX = margin; // left align with margin
      let imgY = y + 5;
      // Ensure it doesn't exceed page bottom
      if (imgY + imgHeightMm > doc.internal.pageSize.height - bottomMargin) {
        // push it up so it fits above bottom margin
        imgY = doc.internal.pageSize.height - bottomMargin - imgHeightMm - 10;
        if (imgY < y) {
          // If there's no room remaining on the page, add a new page and start near top
          doc.addPage();
          imgY = margin + 40;
        }
      }

      // Add image
      doc.addImage(dataURL, "PNG", imgX, imgY, imgWidthMm, imgHeightMm);
      imageEmbedded = true;

      // Move y to below image so that name/title don't overlap
      y = Math.max(y, imgY + imgHeightMm + 4);
    } catch (err) {
      // Likely a CORS issue or image load problem. Fall through to graceful warning.
      console.warn("Could not embed signature image into PDF:", err);
      imageEmbedded = false;
    }
  }

  // Optionally add a small note if the image could not be embedded
  if (!imageEmbedded) {
    const warnText = "(Signature image could not be embedded — server may block cross-origin access)";
    if (y + lineHeight > doc.internal.pageSize.height - margin) {
      doc.addPage();
      y = margin;
    }
    doc.setFontSize(10);
    doc.text(warnText, margin, y);
    y += lineHeight + 4;
    doc.setFontSize(14);
  }

  // Save the PDF
  doc.save("casual_leave_application.pdf");
}
</script>

</body>
</html>
