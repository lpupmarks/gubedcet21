<!doctype html><html lang='as'><head><meta charset='utf-8'><meta name=viewport content='width=device-width,initial-scale=1'>
<title>Borgeet Reader</title><style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f5f5f5}
.card{background:#fff;padding:16px;border-radius:10px;margin:16px 0}.line{font-size:1.3em;margin:8px 0}.word{color:#0a58ca;cursor:pointer;font-weight:600}
#modal{display:none;position:fixed;inset:0;background:#0007}#box{background:#fff;max-width:520px;margin:8% auto;padding:18px;border-radius:10px}
button{padding:8px 12px}
</style></head><body>
<h1 id=title></h1><p id=meta></p><div id=app></div>
<div id=modal onclick="if(event.target==this)this.style.display='none'"><div id=box><h2 id=mw></h2><p><b>অসমীয়া</b><br><span id=ma></span></p><p><b>English</b><br><span id=me></span></p><div id=mr></div><button onclick="modal.style.display='none'">Close</button></div></div>
<script>
async function load(){
 const d=await (await fetch('borgeet.json')).json();
 title.textContent=d.title; meta.textContent=(d.author||'')+' '+(d.raga||'');
 const app=document.getElementById('app');
 d.stanzas.forEach((st,i)=>{
  const c=document.createElement('div'); c.className='card';
  if(st.title){let h=document.createElement('h2');h.textContent=st.title;c.appendChild(h);}
  st.lines.forEach(L=>{
    const p=document.createElement('div');p.className='line';
    let pos=0;
    (L.words||[]).sort((a,b)=>L.text.indexOf(a.word)-L.text.indexOf(b.word)).forEach(w=>{
      const idx=L.text.indexOf(w.word,pos);
      if(idx<0)return;
      p.append(document.createTextNode(L.text.slice(pos,idx)));
      const s=document.createElement('span');s.className='word';s.textContent=w.word;
      s.onclick=()=>show(w);p.appendChild(s);pos=idx+w.word.length;
    });
    p.append(document.createTextNode(L.text.slice(pos)));
    c.appendChild(p);
  });
  let g=document.createElement('div');g.innerHTML='<hr><b>অসমীয়া:</b> '+st.meaning.assamese+'<br><br><b>English:</b> '+st.meaning.english;c.appendChild(g);
  app.appendChild(c);
 });
}
function show(w){
 mw.textContent=w.word;ma.textContent=w.assamese||'';me.textContent=w.english||'';
 mr.innerHTML='<h3>Root</h3>'+((w.root||[]).map(r=>'<div><b>'+r.word+'</b> — '+r.meaning+'</div>').join('')||'—');
 modal.style.display='block';
}
load();
</script></body></html>
