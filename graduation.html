<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PDF Viewer</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #111;
    color: #fff;
  }

  h1 {
    text-align: center;
    margin: 12px 0;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    padding: 12px;
  }

  .card {
    background: #222;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s;
  }

  .card:hover {
    transform: scale(1.03);
  }

  .pdf-icon {
    font-size: 42px;
    margin-bottom: 8px;
  }

  .id {
    font-size: 13px;
    word-break: break-all;
    opacity: 0.9;
  }

  .pagination {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 12px;
  }

  button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Modal PDF viewer */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 999;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: #000;
  }

  .modal iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #444;
  }

  .controls {
    display: flex;
    gap: 10px;
  }
</style>
</head>

<body>

<h1>PDF Gallery</h1>

<div class="gallery" id="gallery"></div>

<div class="pagination">
  <button id="prevPage">⬅ Prev</button>
  <span id="pageInfo"></span>
  <button id="nextPage">Next ➡</button>
</div>

<!-- PDF Modal -->
<div class="modal" id="modal">
  <div class="modal-header">
    <div id="pdfTitle"></div>
    <div class="controls">
      <button onclick="prevPdf()">⬅</button>
      <button onclick="nextPdf()">➡</button>
      <button onclick="closeModal()">✕</button>
    </div>
  </div>
  <iframe id="pdfFrame"></iframe>
</div>

];

const PER_PAGE = 24;
let currentPage = 1;
let currentIndex = 0;

const gallery = document.getElementById("gallery");
const pageInfo = document.getElementById("pageInfo");

function renderGallery() {
  gallery.innerHTML = "";

  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = IDS.slice(start, start + PER_PAGE);

  pageItems.forEach((id, idx) => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="pdf-icon">📄</div>
      <div class="id">${id}.pdf</div>
    `;
    div.onclick = () => openPdf(start + idx);
    gallery.appendChild(div);
  });

  pageInfo.textContent =
    `Page ${currentPage} / ${Math.ceil(IDS.length / PER_PAGE)}`;

  document.getElementById("prevPage").disabled = currentPage === 1;
  document.getElementById("nextPage").disabled =
    currentPage * PER_PAGE >= IDS.length;
}

function openPdf(index) {
  currentIndex = index;
  const id = IDS[currentIndex];
  document.getElementById("pdfFrame").src = `https://rectteduassam.in/elementary2025/lp_up_2025/DOCUMENTS_FOLDR/gradsmarksheet/${id}GM.pdf`;
  document.getElementById("pdfTitle").textContent = `${id}.pdf`;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("pdfFrame").src = "";
}

function nextPdf() {
  if (currentIndex < IDS.length - 1) {
    openPdf(currentIndex + 1);
  }
}

function prevPdf() {
  if (currentIndex > 0) {
    openPdf(currentIndex - 1);
  }
}

document.getElementById("prevPage").onclick = () => {
  if (currentPage > 1) {
    currentPage--;
    renderGallery();
  }
};

document.getElementById("nextPage").onclick = () => {
  if (currentPage * PER_PAGE < IDS.length) {
    currentPage++;
    renderGallery();
  }
};

renderGallery();
</script>

</body>
</html>
