<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      text-align: center;
      font-family: sans-serif;
    }
  </style>
  <script>
    function startCountdown() {
      const now = new Date();
      const target = new Date(now.getFullYear(), 8, 9, 0, 0, 0); 
      // Month is 0-based → 8 = September

      function updateCountdown() {
        const now = new Date();
        const distance = target - now;

        if (distance <= 0) {
          document.getElementById("countdown").textContent = "Redirecting...";
          window.location.href = "/ni.html"; // <-- change this URL
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("countdown").textContent =
          days + "d " + hours + "h " + minutes + "m " + seconds + "s left.";
      }

      updateCountdown();
      setInterval(updateCountdown, 10);
    }

    window.onload = startCountdown;
  </script>
</head>
<body>
  <h1>Will work at/after 12 AM on September 9</h1>
  <p id="countdown">Loading...</p>
</body>
</html>
